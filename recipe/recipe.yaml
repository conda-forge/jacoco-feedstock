context:
  version: "0.8.16"

package:
  name: jacoco
  version: ${{ version }}

source:
  url: https://github.com/jacoco/jacoco/archive/v${{ version }}.tar.gz
  sha256: 82ed6d4af30dae1802bf5a7afe7e3b80b743bd4ec08ffe6847cc11f7dd44d959

build:
  number: 0
  noarch: generic

requirements:
  build:
    - findutils
    - maven
    - openjdk =21
    - unzip
  run:
    - openjdk

tests:
  - script:
      - jacoco --help

about:
  license: EPL-2.0
  license_file:
    - LICENSE.md
    - target/generated-resources/licenses/
  summary: Java Code Coverage Library
  homepage: https://github.com/jacoco/jacoco
  repository: https://github.com/jacoco/jacoco

extra:
  recipe-maintainers:
    - danielnachun
