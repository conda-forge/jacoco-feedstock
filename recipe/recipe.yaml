context:
  version: "0.8.15"

package:
  name: jacoco
  version: ${{ version }}

source:
  url: https://github.com/jacoco/jacoco/archive/v${{ version }}.tar.gz
  sha256: 15af5111ddbea7cd8b31ce7e4d7acdc18fe2afba2222b4ddbb585d30bfbe6b15

build:
  number: 0
  noarch: generic

requirements:
  build:
    - findutils
    - maven
    - openjdk =17
    - unzip
  run:
    - openjdk

tests:
  - script:
      - jacoco --help

about:
  license: EPL-2.0
  license_file:
    - LICENSE.md
    - target/generated-resources/licenses/
  summary: Java Code Coverage Library
  homepage: https://github.com/jacoco/jacoco
  repository: https://github.com/jacoco/jacoco

extra:
  recipe-maintainers:
    - danielnachun
